name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: portwatch-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: portwatch-macos-aarch64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: portwatch-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: portwatch-linux-aarch64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz portwatch
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Check out main (not the detached tag) with full history so we can
      # commit the updated Homebrew formula back. The release itself is still
      # created for the pushed tag via GITHUB_REF, regardless of the checked-out
      # ref. The downloaded artifacts come from the build jobs, not from git.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            portwatch-macos-x86_64.tar.gz
            portwatch-macos-aarch64.tar.gz
            portwatch-linux-x86_64.tar.gz
            portwatch-linux-aarch64.tar.gz

      - name: Update Homebrew formula
        run: |
          set -euo pipefail

          SHA_MACOS_ARM=$(shasum -a 256 portwatch-macos-aarch64.tar.gz | cut -d' ' -f1)
          SHA_MACOS_X86=$(shasum -a 256 portwatch-macos-x86_64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_ARM=$(shasum -a 256 portwatch-linux-aarch64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_X86=$(shasum -a 256 portwatch-linux-x86_64.tar.gz | cut -d' ' -f1)
          VERSION=${GITHUB_REF_NAME#v}

          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/portwatch.rb

          # Replace each sha256 by matching the filename in the url line that
          # precedes it, so the update is independent of the block ordering and
          # works whether the current value is a real hash or PLACEHOLDER.
          awk \
            -v m_arm="$SHA_MACOS_ARM" \
            -v m_x86="$SHA_MACOS_X86" \
            -v l_arm="$SHA_LINUX_ARM" \
            -v l_x86="$SHA_LINUX_X86" '
            /url / {
              if ($0 ~ /macos-aarch64/)      pending = m_arm
              else if ($0 ~ /macos-x86_64/)  pending = m_x86
              else if ($0 ~ /linux-aarch64/) pending = l_arm
              else if ($0 ~ /linux-x86_64/)  pending = l_x86
              else                           pending = ""
              print; next
            }
            /sha256 / && pending != "" {
              sub(/sha256 "[^"]*"/, "sha256 \"" pending "\"")
              pending = ""
              print; next
            }
            { print }
          ' Formula/portwatch.rb > Formula/portwatch.rb.tmp
          mv Formula/portwatch.rb.tmp Formula/portwatch.rb

          if grep -q PLACEHOLDER Formula/portwatch.rb; then
            echo "::error::Formula still contains PLACEHOLDER after update"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/portwatch.rb
          git commit -m "chore: update Homebrew formula for v${VERSION}" \
            || { echo "Formula already up to date"; exit 0; }
          git push origin HEAD:main
